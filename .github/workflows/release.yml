# Publishing is manual: tanilo-mcp is published from the "tanilo" npm account by hand
# (npm publish --access public, with 2FA). This workflow only builds and packs on a tag
# so the tarball contents can be inspected; it never publishes.
name: Build and pack on tag

on:
  push:
    tags:
      - "v*"

jobs:
  pack:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: npm pack --dry-run
